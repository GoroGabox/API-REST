<title>Brújula del Libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: galera de corrección — índice (izq.) · página de lectura (centro, serif) · notas al margen (der.).
     Regla visual: lo que se LEE es tinta sobre papel, sin bordes; lo que se EDITA es azul (acciones, modo edición). */
  :root{
    --desk:#eef0ee; --page:#ffffff; --ink:#1c2128; --ink-2:#3b434d; --muted:#6b7480; --faint:#9aa2ab;
    --line:#dfe3e6; --line-2:#cbd1d6; --hover:#f4f6f7;
    --edit:#2c56c9; --edit-soft:#e8eefc; --edit-ink:#1d3f9e;
    --mark:#fce28a; --mark-soft:#fdf1c4;
    --c-com:#7a5bd6; --c-com-soft:#efeafd; --c-sug:#1d8a58; --c-sug-soft:#e1f3ea;
    --c-err:#c23a2e; --c-err-soft:#fbe7e5; --c-src:#0f7f8a; --c-src-soft:#dff2f3; --c-warn:#a8660c;
    --on-dark:#ffffff; --bar:#1c2128;
    --f-read:"Literata",Georgia,"Times New Roman",serif; --f-ui:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --r:10px; --shadow:0 1px 2px rgba(20,26,32,.05),0 8px 24px rgba(20,26,32,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --desk:#111315; --page:#1a1d20; --ink:#e7e9ec; --ink-2:#c5cad0; --muted:#98a0a9; --faint:#6d757e;
    --line:#2b3035; --line-2:#3a4046; --hover:#22262a;
    --edit:#7ea2ff; --edit-soft:#1e2a47; --edit-ink:#a9c0ff;
    --mark:rgba(250,204,21,.34); --mark-soft:rgba(250,204,21,.16);
    --c-com:#b39cff; --c-com-soft:#2a2342; --c-sug:#5fcf98; --c-sug-soft:#17301f; --c-err:#ff8a7e; --c-err-soft:#3a1d1a;
    --c-src:#5cc9d2; --c-src-soft:#15302f; --c-warn:#e3a54f; --on-dark:#111315; --bar:#e7e9ec;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --desk:#111315; --page:#1a1d20; --ink:#e7e9ec; --ink-2:#c5cad0; --muted:#98a0a9; --faint:#6d757e;
    --line:#2b3035; --line-2:#3a4046; --hover:#22262a;
    --edit:#7ea2ff; --edit-soft:#1e2a47; --edit-ink:#a9c0ff;
    --mark:rgba(250,204,21,.34); --mark-soft:rgba(250,204,21,.16);
    --c-com:#b39cff; --c-com-soft:#2a2342; --c-sug:#5fcf98; --c-sug-soft:#17301f; --c-err:#ff8a7e; --c-err-soft:#3a1d1a;
    --c-src:#5cc9d2; --c-src-soft:#15302f; --c-warn:#e3a54f; --on-dark:#111315; --bar:#e7e9ec;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{background:var(--desk)}
  body{color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--edit);outline-offset:2px}
  .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* ---------- barra superior ---------- */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--desk) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;padding:var(--s3) var(--s5)}
  .brand{font-family:var(--f-read);font-weight:600;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
  .course-sel{border:0;background:transparent;font-weight:600;font-size:14px;padding:var(--s1) var(--s2);border-radius:8px;cursor:pointer;max-width:220px}
  .course-sel:hover{background:var(--hover)}
  .views{display:flex;gap:2px;background:var(--line);padding:3px;border-radius:10px}
  .views button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
  .views button[aria-pressed="true"]{background:var(--page);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .views .n{font-family:var(--f-num);font-size:11px;color:var(--faint);margin-left:4px}
  .spacer{flex:1}
  .who{display:flex;align-items:center;gap:var(--s2)}
  .role{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .role button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .role button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
  .name{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;width:140px;font-size:13px}
  .name:hover,.name:focus{border-color:var(--line-2);background:var(--page)}
  .icon-btn{border:0;background:transparent;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
  .icon-btn:hover{background:var(--hover);color:var(--ink)}
  input[type=file]{display:none}

  /* ---------- barra de contexto ---------- */
  .ctx{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:var(--s2) var(--s5);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2);min-height:48px}
  .ctx .state{display:flex;align-items:center;gap:var(--s2)}
  .ctx .dot{width:8px;height:8px;border-radius:50%;background:var(--c-warn);flex:none}
  .ctx .dot.ok{background:var(--c-sug)} .ctx .dot.aud{background:var(--c-com)}
  .ctx .hint{color:var(--muted)}
  .btn{border:1px solid var(--line-2);background:var(--page);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--ink-2)}
  .btn.primary{background:var(--edit);border-color:var(--edit);color:var(--on-dark)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--edit-ink)}
  .btn.ghost:hover{background:var(--edit-soft)}
  .btn.danger{color:var(--c-err)}
  .btn[aria-pressed="true"]{background:var(--edit-soft);border-color:var(--edit);color:var(--edit-ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- galera ---------- */
  .app{display:grid;grid-template-columns:288px minmax(0,1fr) 340px;align-items:start;min-height:calc(100vh - 110px)}
  .nav,.notes{position:sticky;top:calc(110px + env(safe-area-inset-top,0px));max-height:calc(100vh - 110px);overflow:auto;padding:var(--s5) var(--s4)}
  .nav{border-right:1px solid var(--line)}
  .notes{border-left:1px solid var(--line)}
  .stage{padding:var(--s6) var(--s5) var(--s7);min-width:0}
  .paper{background:var(--page);max-width:760px;margin:0 auto;border-radius:14px;box-shadow:var(--shadow);padding:var(--s7) clamp(20px,6vw,72px)}

  /* índice */
  .nav-h{display:grid;gap:var(--s3);margin-bottom:var(--s4)}
  .nav-h .sum{font-size:12px;color:var(--muted)}
  .search{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--page);padding:7px 10px;font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line-2);border-radius:999px;background:transparent;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
  .nav.editing{background:linear-gradient(var(--edit-soft),var(--edit-soft)) left top/3px 100% no-repeat}
  .editing-tag{font-size:11.5px;font-weight:600;color:var(--edit-ink);background:var(--edit-soft);border-radius:6px;padding:4px 8px}
  .nu{display:flex;align-items:center;gap:var(--s2);width:100%;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:8px;margin-top:var(--s3);padding:var(--s2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .nu:hover{background:var(--hover);color:var(--ink)}
  .nu[aria-current="true"]{background:var(--page);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .nu .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nu .cdot{width:7px;height:7px;border-radius:50%;flex:none}
  .nl{display:flex;align-items:center;gap:var(--s2);width:100%;border:0;background:transparent;text-align:left;padding:7px var(--s2);border-radius:8px;cursor:pointer;color:var(--ink-2)}
  .nl:hover{background:var(--hover)}
  .nl[aria-current="true"]{background:var(--page);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .nl .k{font-family:var(--f-num);font-size:11px;color:var(--faint);min-width:30px}
  .nl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
  .ind{display:flex;gap:4px;align-items:center;flex:none}
  .ind .w{width:6px;height:6px;border-radius:50%;background:var(--c-warn)}
  .ind .x{width:6px;height:6px;border-radius:50%;background:var(--c-err)}
  .ind .c{font-family:var(--f-num);font-size:10.5px;min-width:18px;text-align:center;padding:1px 5px;border-radius:999px;background:var(--c-com-soft);color:var(--c-com)}
  .ind .c.done{background:transparent;color:var(--faint)}
  .more{border:0;background:transparent;color:var(--edit);border-radius:6px;padding:2px 6px;cursor:pointer;font-size:15px;line-height:1}
  .more:hover{background:var(--edit-soft)}
  .row{display:flex;align-items:center;gap:2px}
  .row .nl{flex:1;min-width:0}

  /* barra de herramientas de estructura (misma para toda lección/unidad) */
  .tbar{position:sticky;top:calc(118px + env(safe-area-inset-top,0px));z-index:6;max-width:1000px;margin:0 auto var(--s4);background:var(--page);border-radius:12px;box-shadow:var(--shadow);padding:var(--s2) var(--s3);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4)}
  .tb-l{display:flex;align-items:center;gap:var(--s2);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .tb-mode{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--edit-soft);color:var(--edit-ink);border-radius:5px;padding:2px 7px}
  .tb-mode.aud{background:var(--c-com-soft);color:var(--c-com)}
  .tb-groups{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) 0;flex:1;min-width:0}
  .tb-g{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:0 var(--s2);border-left:1px solid var(--line)}
  .tb-g:first-child{border-left:0;padding-left:0}
  .tb{border:0;background:transparent;color:var(--edit-ink);font-size:12.5px;font-weight:500;padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .tb:hover{background:var(--edit-soft)}
  .tb:disabled{color:var(--faint);background:transparent;cursor:not-allowed}
  .tb.danger{color:var(--c-err)}
  .tb.danger:hover{background:var(--c-err-soft)}
  .tb-sel,.tb-f select,.tb-f input{border:1px solid var(--line-2);border-radius:7px;background:var(--page);font-size:12.5px;padding:4px 6px;color:var(--ink)}
  .tb-sel{max-width:120px}
  .tb-f{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:0 4px}
  .tb-f select{max-width:170px} .tb-f input{width:64px}
  .tb-note{font-size:12px;color:var(--muted);padding:0 var(--s2)}
  .ttl-edit{display:grid;gap:var(--s2);margin:0 0 var(--s4)}
  .ttl-in{font-family:var(--f-read);font-weight:600;font-size:clamp(22px,2.6vw,28px);border:0;border-bottom:2px solid var(--edit);background:var(--edit-soft);border-radius:8px 8px 0 0;padding:6px 10px;width:100%}
  .ttl-acts{display:flex;gap:var(--s2)}
  .eyebrow.link{border:0;background:transparent;padding:0;cursor:pointer;display:block;text-align:left}
  .eyebrow.link:hover{color:var(--edit-ink)}
  .cdot-i{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:1px}
  .ustrip{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;margin:0 0 var(--s5)}
  .ustrip i{background:var(--c-sug);opacity:.45;min-width:3px} .ustrip i.w{background:var(--c-warn);opacity:.7}
  .ulist{display:grid}
  .urow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto auto;gap:var(--s3);align-items:center;border:0;background:transparent;text-align:left;padding:var(--s3) var(--s2);border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}
  .urow:hover{background:var(--hover)}
  .urow .k{font-size:12px;color:var(--faint)} .urow .t{font-family:var(--f-read);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .urow .m{font-size:12px;color:var(--muted);white-space:nowrap}
  .ucut{height:0;position:relative;z-index:1}
  .ucut button{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);border:1px solid var(--edit);background:var(--page);color:var(--edit-ink);border-radius:999px;padding:1px 10px;font-size:11.5px;cursor:pointer;opacity:0;transition:opacity .12s}
  .ulist:hover .ucut button,.ucut button:focus{opacity:.35} .ucut button:hover{opacity:1}
  @media (max-width:780px){.urow{grid-template-columns:40px minmax(0,1fr) auto}.urow .m{display:none}.tbar{top:0;position:static}}

  /* página de lectura */
  .eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:var(--s3)}
  .ttl{font-family:var(--f-read);font-weight:600;font-size:clamp(24px,3vw,32px);line-height:1.2;letter-spacing:-.015em;margin:0 0 var(--s4);text-wrap:balance}
  .meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;font-size:12.5px;color:var(--muted);padding-bottom:var(--s5);border-bottom:1px solid var(--line);margin-bottom:var(--s6)}
  .meta b{color:var(--ink-2);font-weight:500}
  .wbar{display:inline-block;position:relative;width:88px;height:4px;border-radius:2px;background:var(--line);vertical-align:middle}
  .wbar i{position:absolute;top:0;bottom:0;background:var(--c-sug-soft);border-left:1px solid var(--c-sug);border-right:1px solid var(--c-sug)}
  .wbar em{position:absolute;top:-3px;width:3px;height:10px;border-radius:2px;background:var(--c-sug)}
  .wbar em.w{background:var(--c-warn)}
  .flags{list-style:none;margin:calc(-1 * var(--s4)) 0 var(--s6);padding:0;display:grid;gap:var(--s1);font-size:13px;color:var(--c-warn)}
  .flags li::before{content:"● ";font-size:9px;vertical-align:1px}
  .reading{font-family:var(--f-read);font-size:17px;line-height:1.75;color:var(--ink);max-width:66ch}
  .reading p{margin:0 0 1.05em}
  .figs{margin:var(--s6) 0;padding-top:var(--s5);border-top:1px solid var(--line);font-family:var(--f-ui)}
  .figs h2{font-size:14px;font-weight:600;margin:0 0 var(--s4)}
  .figs h2 small{color:var(--muted);font-weight:500}
  .figcard{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:var(--s4);margin:0 0 var(--s4);align-items:start}
  .figcard img,.fig img{max-width:100%;max-height:220px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
  .figcard figcaption{display:grid;gap:var(--s1);font-size:13px}
  .figcard small{color:var(--muted)}
  .figacts{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s1)}
  .fig{margin:1.2em 0;text-align:center}
  .fig figcaption{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:.4em}
  .fig-miss{display:inline-block;font-family:var(--f-ui);font-size:12px;color:var(--c-warn)}
  @media (max-width:640px){.figcard{grid-template-columns:1fr}}
  .reading h2{font-family:var(--f-read);font-size:20px;font-weight:600;margin:1.6em 0 .5em;line-height:1.3}
  .reading h3{font-family:var(--f-read);font-size:18px;font-weight:600;margin:1.4em 0 .4em}
  .reading ul{margin:0 0 1.05em;padding-left:1.2em}
  .reading li{margin:.25em 0}
  .reading ::selection{background:color-mix(in srgb,var(--edit) 25%,transparent)}
  .anno-tip{font-family:var(--f-ui);font-size:12px;color:var(--faint);margin:0 0 var(--s4)}
  .source{margin:0 0 var(--s6);border-radius:var(--r);background:var(--desk);padding:var(--s4) var(--s5)}
  .source summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500}
  .source .ex{font-family:var(--f-read);font-size:14.5px;line-height:1.65;color:var(--ink-2);margin-top:var(--s3);white-space:pre-wrap}
  .pager{display:flex;justify-content:space-between;gap:var(--s4);margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid var(--line)}
  .pager button{border:0;background:transparent;color:var(--muted);cursor:pointer;text-align:left;max-width:48%;padding:var(--s2);border-radius:8px}
  .pager button:hover{background:var(--hover);color:var(--ink)}
  .pager button:last-child{text-align:right}
  .pager small{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .empty{text-align:center;color:var(--muted);padding:var(--s7) var(--s4);font-size:14px;line-height:1.7}
  .empty b{color:var(--ink)}
  .empty code{font-family:var(--f-num);font-size:12px;background:var(--desk);padding:2px 6px;border-radius:5px}

  /* marcas de anotación */
  mark.ann{color:inherit;border-radius:2px;padding:0 1px;cursor:pointer;background:var(--mark);box-decoration-break:clone;-webkit-box-decoration-break:clone}
  mark.t-comentario{background:transparent;border-bottom:2px solid var(--c-com);background:var(--c-com-soft)}
  mark.t-sugerencia{background:var(--c-sug-soft);border-bottom:2px solid var(--c-sug)}
  mark.t-sugerencia:not(.applied){text-decoration:line-through;text-decoration-color:var(--c-sug);text-decoration-thickness:1.5px}
  mark.t-error{background:var(--c-err-soft);border-bottom:2px wavy var(--c-err)}
  mark.t-fuente{background:var(--c-src-soft);border-bottom:2px dotted var(--c-src)}
  mark.t-propuesta{background:var(--edit-soft);border-bottom:2px solid var(--edit)}
  mark.applied{background:var(--c-sug-soft);border-bottom:2px solid var(--c-sug)}
  mark.done:not(.applied){opacity:.55}
  mark.pending{background:color-mix(in srgb,var(--edit) 22%,transparent);border-bottom:2px solid var(--edit)}
  mark.hot,mark.flash{outline:2px solid var(--ink);outline-offset:1px}

  /* barra flotante de selección */
  .selbar{position:absolute;z-index:60;display:flex;gap:2px;background:var(--bar);color:var(--page);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(-50%,-100%);white-space:nowrap}
  .selbar button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
  .selbar button:hover{background:color-mix(in srgb,var(--page) 16%,transparent)}
  .selbar .sw{width:10px;height:10px;border-radius:3px;flex:none}
  .selbar .sep{width:1px;background:color-mix(in srgb,var(--page) 22%,transparent);margin:4px 2px}

  /* menú de edición de estructura */
  .menu{position:absolute;z-index:60;background:var(--page);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:var(--s2);width:260px;display:grid;gap:2px}
  .menu h4{margin:var(--s1) var(--s2) var(--s2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--edit-ink)}
  .menu button.mi{border:0;background:transparent;text-align:left;padding:7px var(--s2);border-radius:7px;cursor:pointer;font-size:13px}
  .menu button.mi:hover{background:var(--edit-soft)}
  .menu button.mi:disabled{opacity:.4;cursor:not-allowed;background:transparent}
  .menu button.mi.danger{color:var(--c-err)}

<script>
/* ======================================================================
   Constantes y estado
   ====================================================================== */
const CATS=[
  ["Legislación y Normativa de Tránsito","#dc2626"],["Señales de Tránsito","#f59e0b"],["Conducción Defensiva","#0891b2"],
  ["Velocidad y Distancias de Seguridad","#ec4899"],["Prioridad y Derecho de Paso","#10b981"],["Adelantamiento y Maniobras","#3b82f6"],
  ["Estacionamiento y Detención","#8b5cf6"],["Alcohol, Drogas y Fatiga","#b91c1c"],["Condiciones Ambientales y Visibilidad","#0d9488"],
  ["Mecánica y Mantención del Vehículo","#64748b"],["Primeros Auxilios","#e11d48"],["Prevención de Riesgos e Incendios","#ea580c"],
  ["Aspectos Psicológicos y Relaciones Humanas","#7c3aed"],["Transporte Profesional (Carga y Pasajeros)","#475569"],["General","#8a8580"]];
const CAT_COLOR=Object.fromEntries(CATS);
const BANDS={corta:[400,550,700],media:[700,950,1200],larga:[1200,1500,1800]};
const SEV={critica:3,mayor:2,menor:1};
const TYPE_LABEL={resaltado:"Resaltado",comentario:"Comentario",sugerencia:"Sugerencia",error:"Error de contenido",fuente:"Pide fuente",propuesta:"Propuesta de estructura",correccion:"Corrección"};
const BUNDLE=(()=>{try{const n=document.getElementById("bundle");return n?JSON.parse(n.textContent):null}catch(e){return null}})();

const state={active:null,view:"estructura",entries:{},role:"editor",autor:"",
  sel:{plan:null,curso:null}, split:null, renaming:false, confirm:false,
  q:"",fAlerts:false,fNotes:false, pendOnly:false,
  pending:null, composer:null, menu:null, replyTo:null, editing:null,
  orphans:new Set(), order:{},
  r:{autor:"",fase:"",estado:"",tipo:""}};
const el=id=>document.getElementById(id);
const E=()=>state.entries[state.active];
const clone=o=>JSON.parse(JSON.stringify(o));
const isAud=()=>state.role==="auditor";

/* ======================================================================
   Utilidades
   ====================================================================== */
function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){return null}}
let toastEl;
function toast(msg,action){
  if(toastEl)toastEl.remove();
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;
  if(action){const b=document.createElement("button");b.textContent=action[0];b.onclick=()=>{t.remove();action[1]();};t.appendChild(b);}
  document.body.appendChild(t);toastEl=t;setTimeout(()=>t.remove(),action?5000:3000);
}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
const bold=s=>s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
const words=s=>String(s||"").split(/\s+/).filter(Boolean).length;
const fmt=n=>Number(n||0).toLocaleString("es-CL");
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
const planKey=p=>JSON.stringify(p.unidades.map(u=>[u.id,u.nombre,u.categoria,u.lecciones.map(l=>[l.id,l.nombre,l.paginas,l.palabras_fuente,l.palabras_objetivo,hash(l.texto||"")])]));
const courseKeyOf=c=>hash(JSON.stringify(c.lessons.map(l=>[l.clave,l.nombre])));
const pagesSpan=p=>(!p||!p[0])?"s/p":(p[1]&&p[1]>p[0]?`${p[0]}–${p[1]}`:`${p[0]}`);
const slug=s=>String(s||"anonimo").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"anonimo";
const nowISO=()=>new Date().toISOString().slice(0,19)+"Z";
const fdate=s=>{try{const d=new Date(s);return d.toLocaleDateString("es-CL",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
function countIn(t,s){if(!s)return 0;let n=0,i=0;while((i=t.indexOf(s,i))>=0){n++;i+=s.length}return n}
function nthIndex(t,s,n){let i=-1;for(let k=0;k<=n;k++){i=t.indexOf(s,i+1);if(i<0)return -1}return i}
function occBefore(t,s,pos){let n=0,i=t.indexOf(s);while(i>=0&&i<pos){n++;i=t.indexOf(s,i+1)}return n}
async function sha256hex(s){
  try{ if(!(window.crypto&&crypto.subtle))return null;
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){return null}
}
/* ids estables: mismo algoritmo que content_pipeline/review/ids.py */
async function ensureIds(plan){
  const seen=new Set();let weak=false;
  const uniq=b=>{let c=b,n=2;while(seen.has(c)){c=b+"~"+n;n++}seen.add(c);return c};
  for(const u of plan.unidades){
    for(const l of u.lecciones){
      if(!l.id){const h=await sha256hex(l.texto||"");if(!h)weak=true;l.id="L-"+(h?h.slice(0,10):hash(l.texto||""));}
      l.id=uniq(l.id);
    }
    if(!u.id){const first=(u.lecciones[0]||{}).id||"";const h=await sha256hex(u.nombre+"|"+first);if(!h)weak=true;u.id="U-"+(h?h.slice(0,8):hash(u.nombre+first));}
    u.id=uniq(u.id);
  }
  return weak;
}
function diffHTML(a,b){
  const A=String(a||"").split(/(\s+)/),B=String(b||"").split(/(\s+)/);
  if(A.length*B.length>250000)return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const n=A.length,m=B.length,T=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=A[i]===B[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  let i=0,j=0,out="";
  while(i<n&&j<m){ if(A[i]===B[j]){out+=esc(A[i]);i++;j++;} else if(T[i+1][j]>=T[i][j+1]){out+=`<del>${esc(A[i])}</del>`;i++;} else {out+=`<ins>${esc(B[j])}</ins>`;j++;} }
  while(i<n)out+=`<del>${esc(A[i++])}</del>`; while(j<m)out+=`<ins>${esc(B[j++])}</ins>`;
  return out;
}

/* ---- guardar archivos: capability downloads (artifact) o Blob (offline) ---- */
let downloadsNS;
async function getDownloads(){
  if(downloadsNS!==undefined)return downloadsNS;
  try{downloadsNS=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;}catch(e){downloadsNS=null}
  return downloadsNS;
}
async function saveFile(filename,text){
  const d=await getDownloads();
  if(d){
    try{await d.save({filename,data:text});toast("Guardado: "+filename);return true;}
    catch(err){ if(err&&err.code==="declined")return false;
      if(!(err&&["unavailable","not_granted","capability_disabled","capability_removed"].includes(err.code))){toast("No se pudo guardar ("+(err&&err.code||"error")+")");return false;} }
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Descargado: "+filename);return true;
  }catch(e){toast("Este navegador no permite descargar el archivo");return false;}
}
function copyText(txt){
  try{navigator.clipboard.writeText(txt).then(()=>toast("Copiado al portapapeles"),()=>toast("No se pudo copiar: "+txt));}
  catch(e){toast("No se pudo copiar: "+txt);}
}

/* ======================================================================
   Datos: plan, curso, revisión
   ====================================================================== */
const isPlan=raw=>raw&&Array.isArray(raw.unidades)&&raw.unidades.some(u=>Array.isArray(u.lecciones))&&!raw.lessons;
const isReview=raw=>raw&&Array.isArray(raw.items)&&("veredicto" in raw||"version" in raw);
function bandOf(plan){
  const b=(plan.resumen&&plan.resumen.banda)||{};
  const d=BANDS[b.largo||(plan.curso||{}).largo]||BANDS.media;
  return {largo:b.largo||(plan.curso||{}).largo||"media",min:b.min??d[0],max:b.max??d[2]};
}
function normalizeCourse(raw){
  let c;
  if(raw&&raw.manifest&&Array.isArray(raw.lessons)){
    const cu=raw.manifest.curso||{};
    c={curso:{nombre:cu.nombre||"Curso",codigo:cu.codigo||""},
      unidades:(raw.manifest.unidades||[]).map(u=>({orden:u.orden,nombre:u.nombre,categoria:u.categoria})),
      lessons:raw.lessons.map(l=>{
        const q=(l.tipo==="quiz"&&l.contenido&&typeof l.contenido==="object")?
          (l.contenido.questions||[]).map(x=>({q:x.question,opts:x.options,ci:x.correct_index,exp:x.explanation})):null;
        return {uo:l.unidad_orden,un:l.unidad_nombre,cat:l.categoria,tema:l.tema_regulatorio,plan_id:l.plan_id||null,
          nombre:l.nombre,pos:l.posicion,tipo:l.tipo,contenido:q?"":String(l.contenido||""),quiz:q,

   Operaciones de estructura por id (espejo de content_pipeline/review/apply.py)

function recalcPlan(p){
  p.unidades=p.unidades.filter(u=>u.lecciones.length);
  p.unidades.forEach((u,i)=>{
    u.orden=i+1;
    const pg=u.lecciones.map(l=>l.paginas).filter(x=>x&&x[0]);
    u.paginas=pg.length?[Math.min(...pg.map(x=>x[0])),Math.max(...pg.map(x=>x[1]||x[0]))]:[0,0];
    u.palabras=u.lecciones.reduce((n,l)=>n+(l.palabras_fuente||0),0);
  });
  p.resumen=Object.assign({},p.resumen,{unidades:p.unidades.length,
    lecciones:p.unidades.reduce((n,u)=>n+u.lecciones.length,0),palabras_totales:p.unidades.reduce((n,u)=>n+u.palabras,0)});
}
const stripParte=n=>String(n||"").replace(/\s*—\s*parte\s*\d+\s*$/i,"").replace(/\s*\(cont\.\)\s*$/i,"");
function splitSegments(t){
  let s=String(t||"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(s.length<2)s=String(t||"").split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
  return s;
}
const nParas=t=>String(t||"").split(/\n\s*\n/).filter(x=>x.trim()).length;
const shiftFigs=(fs,d)=>(fs||[]).map(f=>Object.assign({},f,{parrafo:f.parrafo==null?null:(+f.parrafo)+d}));
function splitFigs(fs,k,porParrafo){
  const a=[],b=[];
  (fs||[]).forEach(f=>{if(porParrafo&&f.parrafo!=null&&+f.parrafo>=k)b.push(Object.assign({},f,{parrafo:+f.parrafo-k}));else a.push(Object.assign({},f));});
  return [a,b];
}
function findFig(l,fid){const i=(l.figuras||[]).findIndex(f=>f.id===fid);if(i<0)throw new Error("la figura ya no está en la lección");return i;}
function mergeLessons(a,b,max){

    paginas:pg.length?[Math.min(...pg.map(p=>p[0])),Math.max(...pg.map(p=>p[1]||p[0]))]:[0,0],
    texto:(a.texto||"")+"\n\n"+(b.texto||""),palabras_fuente:(a.palabras_fuente||0)+(b.palabras_fuente||0),
    palabras_objetivo:Math.max(a.palabras_objetivo||0,b.palabras_objetivo||0)||max});
  if((a.figuras||[]).length||(b.figuras||[]).length)out.figuras=(a.figuras||[]).map(f=>Object.assign({},f)).concat(shiftFigs(b.figuras,nParas(a.texto)));

}
function splitLesson(l,k){
  const segs=splitSegments(l.texto);
  if(!(k>0&&k<segs.length))throw new Error("punto de corte fuera de rango");
  const A=segs.slice(0,k).join("\n\n"),B=segs.slice(k).join("\n\n"),wa=words(A),wb=words(B),p=l.paginas||[0,0];
  let pa=[0,0],pb=[0,0];
  if(p[0]){const p1=p[1]||p[0],cut=Math.floor(p[0]+(p1-p[0])*wa/Math.max(1,wa+wb)+0.5);pa=[p[0],cut];pb=[cut,p1];}
  const base=stripParte(l.nombre)||l.nombre;
  const out=[Object.assign({},l,{id:l.id+"-a",nombre:base,texto:A,palabras_fuente:wa,paginas:pa}),
          Object.assign({},l,{id:l.id+"-b",nombre:base+" (cont.)",texto:B,palabras_fuente:wb,paginas:pb})];
  if("figuras" in l)[out[0].figuras,out[1].figuras]=splitFigs(l.figuras,k,nParas(l.texto)>=2);

}
function replaceOnce(t,buscar,rep){
  const n=countIn(String(t||""),buscar);
  if(n!==1)throw new Error(n?`el texto aparece ${n} veces`:"el texto a corregir ya no está");
  return String(t).replace(buscar,()=>rep||"");
}
function findUnit(p,id){const i=p.unidades.findIndex(u=>u.id===id);if(i<0)throw new Error("la unidad ya no existe");return i;}

    else if(op==="move_unit"){const j=ui+(+a.dir||0);if(j<0||j>=U.length||j===ui)throw new Error("fuera de rango");[U[ui],U[j]]=[U[j],U[ui]];}
    else if(op==="merge_unit"){if(ui+1>=U.length)throw new Error("no hay unidad siguiente");U[ui].lecciones=U[ui].lecciones.concat(U[ui+1].lecciones);U.splice(ui+1,1);}

    else if(op==="figura_mover"){const [f]=L[li].figuras.splice(findFig(L[li],a.figura),1);const [dui,dli]=findLesson(p,a.leccion||target.id);

      D.figuras.sort((x,y)=>(x.parrafo==null?1e9:+x.parrafo)-(y.parrafo==null?1e9:+y.parrafo));}

}
function describeOp(c){
  const a=c.args||{};
  return ({rename:`Renombrar a «${a.nombre}»`,categoria:`Categoría: ${a.categoria}`,cap:`Tope de ${fmt(a.palabras_objetivo)} palabras`,
    reorder:a.dir<0?"Subir una posición":"Bajar una posición",move_unit:a.dir<0?"Subir la unidad":"Bajar la unidad",
    merge:"Unir con la lección siguiente",merge_unit:"Unir con la unidad siguiente",split:`Dividir antes del párrafo ${+a.k+1}`,
    move:"Mover a otra unidad",new_unit:"Iniciar una unidad nueva aquí",delete:"Quitar del curso",texto:"Corregir el texto fuente",

function newItem(fase,target,f){
  return Object.assign({id:"r-"+slug(state.autor)+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    autor:state.autor||"Anónimo",fecha:nowISO(),fase,target,tipo:"comentario",severidad:"menor",motivo:"",cita:null,cambio:null,
    anclaje:null,estado:"pendiente",decision:null,respuestas:[]},f);
}
function requireAutor(){
  if(state.autor)return true;
  toast("Escribí tu nombre arriba a la derecha para firmar tus notas");el("autor").focus();return false;
}
function findCourseLesson(c,t){
  if(!c)return null;
  if(t.id){const l=c.lessons.find(x=>x.plan_id===t.id);if(l)return l;}
  return c.lessons.find(x=>x.clave===t.clave)||null;
}
function applyContent(c,it){
  const t=it.target,ch=it.cambio,l=findCourseLesson(c,t);
  if(!l)throw new Error(`${t.clave} no existe en el curso`);
  const rep=v=>("valor" in ch)?ch.valor:replaceOnce(v,ch.buscar,ch.reemplazar);
  if(t.tipo==="pregunta"){
    const q=(l.quiz||[])[t.q];if(!q)throw new Error("la pregunta no existe");
    if(ch.campo==="pregunta")q.q=rep(q.q);
    else if(ch.campo==="explicacion")q.exp=rep(q.exp);
    else if(ch.campo==="opcion"){if(q.opts[ch.i]===undefined)throw new Error("la opción no existe");q.opts[ch.i]=rep(q.opts[ch.i]);}
    else if(ch.campo==="correcta"){if(!(ch.valor>=0&&ch.valor<q.opts.length))throw new Error("opción fuera de rango");q.ci=ch.valor;}
  }else if(ch.campo==="contenido")l.contenido=rep(l.contenido);
  else if(ch.campo==="nombre")l.nombre=rep(l.nombre);
}
function rebuildCourse(e){
  if(!e.course0){e.course=null;return;}
  const c=clone(e.course0);
  e.review.items.filter(i=>i.fase==="contenido"&&i.estado==="aceptada"&&i.cambio).forEach(i=>{try{applyContent(c,i);delete i._conf}catch(err){i._conf=err.message}});
  e.course=c;
}
/* registra una nota: el auditor propone; el editor aplica lo que trae cambio */
function commit(item,msg){
  if(!requireAutor())return false;
  const e=E();
  if(!isAud()&&item.cambio&&item.fase==="estructura"&&e.approved){toast("La estructura está aprobada: reabrí la edición para cambiarla");return false;}
  if(!isAud()&&item.cambio){
    try{
      if(item.fase==="estructura"){const p=clone(e.plan);applyOp(p,item.cambio,item.target);pushHist(e);e.plan=p;persistPlan(e);}
      else{applyContent(clone(e.course),item);pushHist(e);}
    }catch(err){toast("No se puede aplicar: "+err.message);return false;}
    item.estado="aceptada";item.decision={por:state.autor,nota:"",fecha:nowISO()};
  }else pushHist(e);
  e.review.items.push(item);persistReview(e);rebuildCourse(e);renderAll();
  toast(msg||"Nota guardada",["Deshacer",undo]);
  return true;
}
/* cambios de estructura desde el menú: el editor los aplica directo, el auditor los propone */
function structural(cambio,target,msg){
  const e=E();
  if(isAud()){commit(newItem("estructura",target,{tipo:"propuesta",cambio}),"Propuesta registrada");return;}
  if(e.approved){toast("La estructura está aprobada: reabrí la edición para cambiarla");return;}
  const p=clone(e.plan);
  try{applyOp(p,cambio,target);}catch(err){toast("No se puede: "+err.message);return;}
  pushHist(e);e.plan=p;persistPlan(e);renderAll();toast(msg||"Estructura actualizada",["Deshacer",undo]);
}
function decide(id,estado){
  const e=E(),it=e.review.items.find(i=>i.id===id);if(!it)return;
  if(estado==="aceptada"&&it.cambio){
    if(it.fase==="estructura"){
      if(e.approved){toast("Reabrí la edición de la estructura para aplicar propuestas");return;}
      const p=clone(e.plan);
      try{applyOp(p,it.cambio,it.target);}catch(err){toast("No se puede aplicar: "+err.message);return;}
      pushHist(e);e.plan=p;persistPlan(e);
    }else{
      try{applyContent(clone(e.course),it);}catch(err){toast("No se puede aplicar: "+err.message);return;}
      pushHist(e);
    }
  }else pushHist(e);
  it.estado=estado;
  it.decision=estado==="pendiente"?null:{por:state.autor||"Editor",nota:"",fecha:nowISO()};
  persistReview(e);rebuildCourse(e);renderAll();
  toast({aceptada:it.cambio?"Aceptada y aplicada":"Marcada como resuelta",rechazada:"Descartada",pendiente:"Reabierta"}[estado],["Deshacer",undo]);
}

  if(mine&&!items.length&&!e.review.veredicto.estructura&&!e.review.veredicto.contenido){toast("Todavía no tenés notas ni veredicto para exportar");return;}
  const out={version:2,curso:e.codigo,generado:nowISO(),plan_hash:e.plan0?hash(planKey(e.plan0)):null,course_hash:e.courseKey||null,
    autor:mine?state.autor:(state.autor||"Editor"),rol:state.role,veredicto:mine?e.review.veredicto:null,veredictos:mine?undefined:e.review.veredictos,items};

function loadReview(raw){

    else{ if(cur.estado==="pendiente"&&(it.estado!=="pendiente"||it.fecha>cur.fecha)){Object.assign(cur,it);act++;}
      const rs=new Set((cur.respuestas||[]).map(r=>r.fecha+r.autor));
      (it.respuestas||[]).forEach(r=>{if(!rs.has(r.fecha+r.autor))(cur.respuestas=cur.respuestas||[]).push(r)}); }
  });

function ctxOf(node){const d=node.dataset;return {src:d.src,lid:d.lid,clave:d.clave,campo:d.campo,q:d.q!==undefined?+d.q:undefined,i:d.i!==undefined?+d.i:undefined};}

/* rango de líneas con offsets en el texto crudo */

/* ancla las notas del campo y devuelve HTML; mode: plain | md | line */
function renderField(c,raw,mode){
  const e=E(),items=e.review.items.filter(it=>sameField(it,c)),ranges=[];
  items.forEach(it=>{
    const a=anchorOf(it);if(!a){state.orphans.delete(it.id);return;}
    let idx=nthIndex(raw,a.needle,a.occ);if(idx<0)idx=raw.indexOf(a.needle);
    if(idx<0){state.orphans.add(it.id);return;}
    state.orphans.delete(it.id);

  });

  if(P&&P.ctxKey===JSON.stringify(c))ranges.push({s:P.s,e:P.e,id:"__new",cls:"pending"});
  ranges.sort((a,b)=>a.s-b.s);

  clean.forEach(r=>{state.order[r.id]=[state.order.__base||0,r.s];});

    let para=[],prev="",gap=false;
    const flush=()=>{if(para.length){out.push("<p>"+para.join(" ")+"</p>");para=[];}};
    L.forEach(({t,o})=>{
      const tt=t.trim();if(!tt){gap=true;return;}
      const soft=prev&&!/[.:;!?»”")]$/.test(prev)&&/^[a-záéíóúñü(«“"0-9]/.test(tt);
      if(gap&&!soft)flush();

  }
  let ul=false,first=true;const close=()=>{if(ul){out.push("</ul>");ul=false}};
  L.forEach(({t,o})=>{

    if(first){first=false;if(/^#\s/.test(tt))return;}  /* el título ya está en la cabecera de la página */

    else if(m=tt.match(/^[-*]\s+/)){if(!ul){out.push("<ul>");ul=true;}out.push(`<li>${span(o+lead+m[0].length,o+t.trimEnd().length,bold)}</li>`);}
    else{close();out.push(`<p>${span(o+lead,o+t.trimEnd().length,bold)}</p>`);}
  });
  close();return out.join("");

/* selección del lector → rango exacto en el texto crudo */
function locateAll(raw,sel){
  const t=String(sel||"").trim().replace(/\s+/g," ");if(!t)return [];
  const gap="[\\s*_#>`\\-]+",pat=[...t].map((ch,k)=>ch===" "?gap:ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+(k<t.length-1&&t[k+1]!==" "?"\\**":"")).join("");
  try{return [...raw.matchAll(new RegExp(pat,"g"))];}catch(e){return []}
}
function expandUnique(raw,s,e){
  while(countIn(raw,raw.slice(s,e))>1&&(s>0||e<raw.length)){
    if(s>0){s--;while(s>0&&!/\s/.test(raw[s-1]))s--;}
    if(e<raw.length){e++;while(e<raw.length&&!/\s/.test(raw[e]))e++;}

function closestEl(n,sel){while(n&&n.nodeType!==1)n=n.parentNode;return n&&n.closest?n.closest(sel):null;}
function readSelection(){
  const s=getSelection();if(!s||!s.rangeCount||s.isCollapsed)return null;
  const r=s.getRangeAt(0),box=closestEl(r.startContainer,"[data-campo]");
  if(!box||box!==closestEl(r.endContainer,"[data-campo]"))return null;
  const txt=s.toString();if(!txt.trim())return null;
  const c=ctxOf(box),raw=fieldRaw(c);
  let approx=0;const ln=closestEl(r.startContainer,".ln");
  if(ln){const pre=document.createRange();pre.selectNodeContents(ln);pre.setEnd(r.startContainer,r.startOffset);approx=(+ln.dataset.o)+pre.toString().length;}
  const ms=locateAll(raw,txt);if(!ms.length)return null;
  const m=ms.reduce((b,x)=>Math.abs(x.index-approx)<Math.abs(b.index-approx)?x:b);
  return {c,raw,s:m.index,e:m.index+m[0].length,cita:m[0],rect:r.getBoundingClientRect()};
}

function targetForCtx(c){

function anclajeFor(p){const a={campo:p.c.campo,cita:p.cita,occ:occBefore(p.raw,p.cita,p.s)};if(p.c.q!=null)a.q=p.c.q;if(p.c.i!=null)a.i=p.c.i;return a;}
function useTool(tool){
  const p=state.pending;el("selbar").hidden=true;if(!p)return;

  }

    text:"",repl:tool==="sugerir"?p.cita:"",sev:tool==="error"?"critica":tool==="sugerir"?"menor":"menor",pag:""};

function saveComposer(){

  const item=newItem(P.fase,P.general?P.target:targetForCtx(P.c),{tipo:P.tool==="comentar"?"comentario":P.tool==="sugerir"?"sugerencia":P.tool,
    severidad:P.sev,motivo:text.trim(),cita:pag?{pagina:parseInt(pag,10),extracto:""}:null,anclaje:P.general?null:anclajeFor(P)});
  if(needRepl){
    const [s2,e2]=expandUnique(P.raw,P.s,P.e),buscar=P.raw.slice(s2,e2),reemplazar=P.raw.slice(s2,P.s)+repl+P.raw.slice(P.e,e2);

  else if(l.palabras_fuente<band.min)a.push(`Fuente corta (menos de ${fmt(band.min)} palabras): considerá unirla con la siguiente.`);

    if(unit){scope="unidad";items=e.review.items.filter(i=>i.fase==="estructura"&&i.target.id===unit.id);}
    else if(cur){items=e.review.items.filter(i=>i.fase==="estructura"&&i.target.id===cur.l.id);
      unitItems=e.review.items.filter(i=>i.fase==="estructura"&&i.target.id===cur.u.id);}
    else{box.innerHTML="";return;}
  }else if(state.view==="contenido"&&e.course&&!(e.plan&&!e.approved&&!isAud())){
    const {cur,uo}=currentCourse();
    if(!cur){scope="unidad";items=e.review.items.filter(i=>i.fase==="contenido"&&i.target.clave==="U"+uo);}
    else{
      items=e.review.items.filter(i=>i.fase==="contenido"&&i.target.clave===cur.clave);
      unitItems=e.review.items.filter(i=>i.fase==="contenido"&&i.target.clave==="U"+cur.uo);
      const a=cur.audit;
      if(cur.visual)sys+=`<div class="note t-juez"><div class="nh"><span class="nt">Revisión visual · ${cur.visual.nivel==="alta"?"obligatoria":"sugerida"}</span></div>
        <div class="body-t">${esc(cur.visual.motivo)}</div>
        <div class="status">Compara la lección con esas páginas del libro: las figuras no llegaron al texto.</div></div>`;
      if(a)sys+=`<div class="note t-juez"><div class="nh"><span class="nt">Juez IA</span>${a.score!=null?`<span class="who-t">fidelidad ${a.score}</span>`:""}</div>
        ${(a.claims||[]).length?`<div class="body-t">No respaldado por la fuente:\n${a.claims.map(x=>"· "+esc(x)).join("\n")}</div>`:""}
        ${(a.cifras||[]).length?`<div class="body-t">Cifras que no están en el libro: ${a.cifras.map(esc).join(", ")}</div>`:""}
        ${a.anclaje!=null?`<div class="status">Anclaje lexical bajo: ${a.anclaje}</div>`:""}
        ${(a.omissions||[]).length?`<div class="body-t">Omite datos importantes del libro (cobertura ${a.coverage}):\n${a.omissions.map(x=>"· "+esc(x)).join("\n")}</div>`:""}
        ${(a.quizProblemas||[]).length?`<div class="body-t">Claves de quiz dudosas:\n${a.quizProblemas.map(x=>"· "+esc(x.pregunta)+" — "+esc(x.problema)).join("\n")}</div>`:""}</div>`;
    }
  }else{box.innerHTML="";return;}
  if(state.pendOnly){items=items.filter(i=>i.estado==="pendiente");unitItems=unitItems.filter(i=>i.estado==="pendiente");}
  const anchored=items.filter(i=>i.anclaje&&state.order[i.id]).sort((a,b)=>state.order[a.id][1]-state.order[b.id][1]);
  const rest=items.filter(i=>!anchored.includes(i));
  const n=items.length+unitItems.length;
  box.innerHTML=`<div class="notes-h"><h3>Notas${n?` <span class="num" style="color:var(--faint)">${n}</span>`:""}</h3><button class="chip" data-chip="pendOnly" aria-pressed="${state.pendOnly}">Solo pendientes</button></div>
    <div class="nlist">${composerHTML()}${sys}${anchored.map(i=>noteHTML(i)).join("")}${rest.map(i=>noteHTML(i)).join("")}
    ${unitItems.length?`<div class="sec-t">Sobre la unidad</div>${unitItems.map(i=>noteHTML(i)).join("")}`:""}
    ${!n&&!state.composer&&!sys?`<p class="notes-empty">Sin notas en esta ${scope}.<br>${scope==="unidad"?"Usá «Comentar unidad» en la barra superior.":"Seleccioná un fragmento del texto para anotarlo o usá la barra superior."} <kbd>J</kbd>/<kbd>K</kbd> recorre las lecciones.</p>`:""}</div>`;
}

function planFileName(e){return "plan_"+e.codigo.toLowerCase()+"_aprobado.json"}
function genCommand(e){return `python manage.py generate_course --from-plan out/${planFileName(e)} --nombre "${e.plan.curso.nombre}" --codigo ${e.codigo} --costo <precio> --out out/${e.codigo.toLowerCase()}.json --judge`;}
function renderCtx(){
  const e=E(),bar=el("ctx"),undoB=`<button class="btn ghost" data-act="undo" ${(e.hist||[]).length?"":"disabled"}>Deshacer</button>`;
  if(state.view==="revision"){bar.hidden=true;return;}bar.hidden=false;
  if(isAud()){
    const mine=e.review.items.filter(i=>i.autor===state.autor).length;
    bar.innerHTML=`<span class="state"><i class="dot aud"></i><b>Modo auditor</b></span><span class="hint">Tus cambios quedan como propuestas para el responsable. ${mine} nota${mine===1?"":"s"} tuya${mine===1?"":"s"}.</span>
      <span class="spacer"></span>${undoB}<button class="btn primary" data-act="to-rev">Veredicto y exportar</button>`;
    return;
  }
  if(state.view==="contenido"){
    const acc=e.review.items.filter(i=>i.fase==="contenido"&&i.estado==="aceptada"&&i.cambio).length,pend=e.review.items.filter(i=>i.fase==="contenido"&&i.estado==="pendiente").length;
    bar.innerHTML=`<span class="state"><i class="dot ${pend?"":"ok"}"></i><b>Contenido</b></span><span class="hint">${pend} nota${pend===1?"":"s"} pendiente${pend===1?"":"s"} · ${acc} cambio${acc===1?"":"s"} aplicado${acc===1?"":"s"}</span><span class="spacer"></span>${undoB}`;
    return;
  }
  if(!e.plan){bar.innerHTML=`<span class="hint">Este curso no tiene plan de estructura.</span>`;return;}
  if(e.approved){
    bar.innerHTML=`<span class="state"><i class="dot ok"></i><b>Estructura aprobada</b></span><span class="hint">${new Date(e.approved.at).toLocaleDateString("es-CL")}</span><span class="spacer"></span>
      <button class="btn ghost" data-act="reopen">Reabrir edición</button><button class="btn" data-act="copy-cmd">Copiar comando de redacción</button><button class="btn primary" data-act="save-plan">Guardar plan aprobado</button>`;
    return;
  }
  const pend=e.review.items.filter(i=>i.fase==="estructura"&&i.estado==="pendiente"&&i.cambio).length;
  if(state.confirm){
    bar.innerHTML=`<span class="state"><i class="dot"></i><b>¿Aprobar la estructura?</b></span><span class="hint">${pend?`Quedan ${pend} propuestas sin decidir. `:""}La edición se bloquea hasta reabrirla.</span><span class="spacer"></span>
      <button class="btn" data-act="confirm-no">Cancelar</button><button class="btn primary" data-act="confirm-yes">Aprobar</button>`;return;
  }
  bar.innerHTML=`<span class="state"><i class="dot"></i><b>Estructura pendiente de aprobación</b></span><span class="hint">${isDirty(e)?"Con cambios sin aprobar · ":""}${pend?`${pend} propuesta${pend===1?"":"s"} de auditores · `:""}Seleccioná texto para anotar; la barra sobre la lección cambia la estructura.</span><span class="spacer"></span>
    ${undoB}${isDirty(e)?`<button class="btn ghost danger" data-act="reset">Descartar cambios</button>`:""}<button class="btn primary" data-act="approve">Aprobar estructura</button>`;
}

        ${Object.keys(e.review.veredictos||{}).length?`<div>${Object.entries(e.review.veredictos).map(([a,v])=>`<div class="vitem"><b>${esc(a)}</b> · estructura: ${vlab[v.estructura||""]} · contenido: ${vlab[v.contenido||""]}${v.comentario?`<div class="status">${esc(v.comentario)}</div>`:""}</div>`).join("")}</div>`:""}`}

function renderAll(){

function setView(v){state.view=v;state.composer=null;state.split=null;closeMenu();el("selbar").hidden=true;renderAll();scrollTo(0,0);try{history.replaceState(null,"","#"+v)}catch(e){}}
function goLesson(key){
  state.composer=null;state.split=null;state.renaming=false;
  if(state.view==="estructura")state.sel.plan=key;else state.sel.curso=key;
  renderAll();scrollTo({top:0});
}
function step(d){
  const e=E();
  if(state.view==="estructura"&&e.plan){
    const all=planLessons(e.plan);let k=all.findIndex(x=>x.l.id===state.sel.plan);
    if(k<0&&isPlanUnit(state.sel.plan)){const f=all.findIndex(x=>x.u.id===state.sel.plan);k=d>0?f-1:f;}
    const n=all[k+d];if(n)goLesson(n.l.id);
  }else if(state.view==="contenido"&&e.course){
    const {all,k,uo}=currentCourse();let i=k;
    if(k<0){const f=all.findIndex(x=>x.uo===uo);i=d>0?f-1:f;}
    const n=all[i+d];if(n)goLesson(n.clave);
  }
}
function flash(node){if(!node)return;node.classList.add("flash");setTimeout(()=>node.classList.remove("flash"),1200);}
function selectEntry(id,view){
  state.active=id;state.composer=null;state.split=null;state.confirm=false;state.sel={plan:null,curso:null};
  fillCourseSel();

  setView(view||(e.plan?(e.approved&&e.course&&!isAud()?"contenido":"estructura"):"contenido"));
}

document.addEventListener("click",ev=>{

  const chip=t.closest("[data-chip]");if(chip){state[chip.dataset.chip]=!state[chip.dataset.chip];renderAll();return;}
  const tbb=t.closest("[data-tb]");if(tbb){if(!tbb.disabled)tbAct(tbb.dataset.tb,tbb);return;}

  const q=t.closest(".quote");if(q){const m=document.querySelector(`mark[data-ann="${CSS.escape(q.dataset.q)}"]`);if(m){m.scrollIntoView({block:"center",behavior:"smooth"});flash(m);}else toast("El fragmento no está en la vista actual");return;}
  const sv=t.closest("[data-sev]");if(sv&&state.composer){state.composer.text=(el("cText")||{}).value||"";state.composer.repl=el("cRepl")?el("cRepl").value:"";state.composer.pag=(el("cPag")||{}).value||"";state.composer.sev=sv.dataset.sev;renderNotes();return;}
  const na=t.closest("[data-na]");if(na){noteAction(na.dataset.na,na.dataset.id);return;}
  const b=t.closest("[data-act]");if(b&&!b.disabled)act(b.dataset.act,b);
});
function noteAction(a,id){
  const e=E(),it=e.review.items.find(i=>i.id===id);
  if(a==="save-comp")return saveComposer();
  if(a==="cancel-comp"){state.composer=null;renderPage();renderNotes();return;}
  if(a==="accept")return decide(id,"aceptada");
  if(a==="reject")return decide(id,"rechazada");
  if(a==="reopen")return decide(id,"pendiente");
  if(a==="reply"){if(!requireAutor())return;state.replyTo=id;renderAll();setTimeout(()=>{const r=el("rText");r&&r.focus()},20);return;}
  if(a==="cancel-reply"){state.replyTo=null;renderAll();return;}
  if(a==="send-reply"){const txt=(el("rText")||{}).value||"";if(!txt.trim())return;pushHist(e);(it.respuestas=it.respuestas||[]).push({autor:state.autor,texto:txt.trim(),fecha:nowISO()});state.replyTo=null;persistReview(e);renderAll();return;}
  if(a==="edit"){state.editing=id;renderAll();setTimeout(()=>{const r=el("eText");r&&r.focus()},20);return;}
  if(a==="cancel-edit"){state.editing=null;renderAll();return;}
  if(a==="save-edit"){pushHist(e);it.motivo=(el("eText")||{}).value.trim();state.editing=null;persistReview(e);renderAll();return;}
  if(a==="del"){pushHist(e);e.review.items=e.review.items.filter(i=>i.id!==id);persistReview(e);renderAll();toast("Nota eliminada",["Deshacer",undo]);return;}
  if(a==="goto"&&it){
    if(it.fase==="estructura"){state.sel.plan=it.target.id;setView("estructura");}
    else{state.sel.curso=it.target.clave;setView("contenido");}
    setTimeout(()=>{const m=document.querySelector(`mark[data-ann="${CSS.escape(id)}"]`),n=document.querySelector(`[data-note="${CSS.escape(id)}"]`);if(m){m.scrollIntoView({block:"center"});flash(m);}flash(n);},60);
  }
}
function act(a,b){
  const e=E();
  const A={
    undo,
    approve:()=>{state.confirm=true;renderCtx();},"confirm-no":()=>{state.confirm=false;renderCtx();},
    "confirm-yes":()=>{e.approved={at:Date.now(),key:hash(planKey(e.plan))};store("brujula-ok3-"+e.codigo,e.approved);e.hist=[];state.confirm=false;renderAll();toast("Estructura aprobada");},
    reopen:()=>{e.approved=null;store("brujula-ok3-"+e.codigo,null);renderAll();},
    reset:()=>{pushHist(e);e.plan=clone(e.plan0);store("brujula-plan3-"+e.codigo,null);renderAll();toast("Plan original restaurado",["Deshacer",undo]);},
    "copy-cmd":()=>copyText(genCommand(e)),
    "copy-apply":()=>copyText(b.parentNode.querySelector("code").textContent),
    "save-plan":()=>{const out=clone(e.plan);recalcPlan(out);out.resumen.aprobado=new Date(e.approved.at).toISOString();
      out.revision_humana=(out.revision_humana||[]).concat([{fecha:nowISO(),fase:"estructura",fuente:"brujula",
        autores:[...new Set(e.review.items.filter(i=>i.fase==="estructura").map(i=>i.autor))],
        aceptadas:e.review.items.filter(i=>i.fase==="estructura"&&i.estado==="aceptada").map(i=>({id:i.id,autor:i.autor,resumen:i.cambio?describeOp(i.cambio):TYPE_LABEL[i.tipo]}))}]);
      saveFile(planFileName(e),JSON.stringify(out,null,2));},
    "to-rev":()=>setView("revision"),"to-plan":()=>setView("estructura"),export:exportReview,
    "split-off":()=>{state.split=null;renderPage();},
    "fig-del":()=>figOp(b,{op:"figura_quitar",args:{figura:b.dataset.fid}},"Figura quitada"),
    "fig-pie":()=>{const v=window.prompt("Pie de figura",b.dataset.pie||"");if(v!=null&&v!==b.dataset.pie)figOp(b,{op:"figura_pie",args:{figura:b.dataset.fid,pie:v}},"Pie actualizado");},
    "fig-up":()=>figOp(b,{op:"figura_mover",args:{figura:b.dataset.fid,parrafo:+b.dataset.par-1}},"Figura movida"),
    "fig-down":()=>figOp(b,{op:"figura_mover",args:{figura:b.dataset.fid,parrafo:+b.dataset.par+1}},"Figura movida"),
    "fig-to":()=>figOp(b,{op:"figura_mover",args:{figura:b.dataset.fid,leccion:b.dataset.to,parrafo:b.dataset.par===""?null:+b.dataset.par}},"Figura movida a otra lección"),
    cut:()=>{const {cur}=currentPlan();state.split=null;structural({op:"split",args:{k:+b.dataset.k}},{tipo:"leccion",id:cur.l.id,nombre:cur.l.nombre,clave:`${cur.u.orden}.${cur.li+1}`},"Lección dividida");},
    "propose-ci":()=>{const {cur}=currentCourse(),qi=+b.dataset.q,i=+b.dataset.i;
      commit(newItem("contenido",targetForCtx({src:"curso",clave:cur.clave,campo:"pregunta",q:qi}),{tipo:"sugerencia",severidad:"critica",cambio:{campo:"correcta",valor:i},motivo:""}),
        isAud()?"Propuesta registrada: opción "+String.fromCharCode(65+i):"Respuesta correcta cambiada");},
  };
  A[a]&&A[a]();
}

document.addEventListener("keydown",ev=>{
  const inField=ev.target.closest&&ev.target.closest("input,select,textarea");

  if((ev.ctrlKey||ev.metaKey)&&!ev.shiftKey&&ev.key.toLowerCase()==="z"){ev.preventDefault();undo();return;}
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  if(ev.key==="j")step(1);else if(ev.key==="k")step(-1);
});
document.querySelectorAll(".views button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
document.querySelectorAll(".role button").forEach(b=>b.addEventListener("click",()=>{state.role=b.dataset.role;store("brujula-role",state.role);state.composer=null;renderAll();}));
el("autor").addEventListener("change",ev=>{state.autor=ev.target.value.trim();store("brujula-autor",state.autor);renderAll();});
el("courseSel").addEventListener("change",ev=>selectEntry(ev.target.value));
el("navToggle").addEventListener("click",()=>el("nav").classList.toggle("open"));
(function(){
  let t=null;try{t=localStorage.getItem("brujula-theme")}catch(e){}
  if(t)document.documentElement.setAttribute("data-theme",t);
  el("theme").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme"),mq=matchMedia("(prefers-color-scheme:dark)").matches;
    const next=(cur?cur==="dark":mq)?"light":"dark";document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("brujula-theme",next)}catch(e){}
  };
})();
el("file").addEventListener("change",async ev=>{
  let last=null,view;
  for(const f of ev.target.files){
    try{
      const raw=JSON.parse(await f.text());
      if(isReview(raw)){const e=loadReview(raw);if(e){last=e;view="revision";}}
      else if(isPlan(raw)){last=await setPlan(raw);view="estructura";toast("Plan abierto: "+last.label+(last.weakIds?" · ids provisorios (usá build_brujula)":""));}
      else{const e=setCourse(raw);if(!e.course.lessons.length)throw new Error("sin lecciones");last=e;view="contenido";toast("Curso abierto: "+e.label);}
    }catch(err){toast("No pude leer "+f.name+": "+err.message);}
  }
  if(last)selectEntry(last.id,view);
  ev.target.value="";
});

/* ---- arranque: bundle embebido (ZIP offline) o archivos publicados junto a la página ---- */
(async function(){
  state.autor=store("brujula-autor")||"";el("autor").value=state.autor;
  state.role=(BUNDLE&&BUNDLE.modo)||store("brujula-role")||"editor";
  if(BUNDLE&&BUNDLE.modo)store("brujula-role",state.role);
  if(BUNDLE){if(BUNDLE.plan)await setPlan(BUNDLE.plan);if(BUNDLE.course)setCourse(BUNDLE.course);}
  else for(const [path,kind] of [["data/plan_b.json","plan"],["data/a2.json","curso"],["data/a4.json","curso"]]){
    try{const r=await fetch(path);if(!r.ok)throw 0;const raw=await r.json();kind==="plan"?await setPlan(raw):setCourse(raw);}catch(e){}
  }
  const ids=Object.keys(state.entries);
  if(!ids.length){el("page").innerHTML='<div class="empty">Abrí un <b>plan.json</b> de plan_course o un JSON de generate_course para empezar.</div>';return;}
  const h=(location.hash||"").slice(1);
  selectEntry(ids[0],["estructura","contenido","revision"].includes(h)?h:undefined);
})();
</script>
